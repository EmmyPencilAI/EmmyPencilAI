<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1128;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Animated Grid -->
  <g opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="200" y1="0" x2="200" y2="500" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="400" y1="0" x2="400" y2="500" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="600" y1="0" x2="600" y2="500" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="800" y1="0" x2="800" y2="500" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="1000" y1="0" x2="1000" y2="500" stroke="#00B4D8" stroke-width="0.5" />
  </g>

  <!-- Radar Sweep -->
  <circle cx="200" cy="250" r="80" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.3" />
  <circle cx="200" cy="250" r="60" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.2" />
  <circle cx="200" cy="250" r="40" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.1" />
  <line x1="200" y1="250" x2="280" y2="170" stroke="#00FF88" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 200 250" to="360 200 250" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Neural Network -->
  <g opacity="0.4">
    <circle cx="900" cy="150" r="4" fill="#00B4D8" />
    <circle cx="950" cy="180" r="4" fill="#00B4D8" />
    <circle cx="850" cy="200" r="4" fill="#00B4D8" />
    <circle cx="920" cy="230" r="4" fill="#00B4D8" />
    <circle cx="880" cy="260" r="4" fill="#00B4D8" />
    <circle cx="960" cy="290" r="4" fill="#00B4D8" />
    <line x1="900" y1="150" x2="950" y2="180" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="900" y1="150" x2="850" y2="200" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="950" y1="180" x2="920" y2="230" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="850" y1="200" x2="880" y2="260" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="920" y1="230" x2="960" y2="290" stroke="#00B4D8" stroke-width="0.5" />
    <line x1="880" y1="260" x2="960" y2="290" stroke="#00B4D8" stroke-width="0.5" />
  </g>

  <!-- Flying Drones -->
  <g>
    <text x="700" y="100" font-size="20" fill="#00B4D8" opacity="0.8">✦</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;30,-20;60,0;30,20;0,0" dur="6s" repeatCount="indefinite" />
  </g>
  <g>
    <text x="750" y="120" font-size="16" fill="#00B4D8" opacity="0.6">✦</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;-20,15;-40,0;-20,-15;0,0" dur="8s" repeatCount="indefinite" />
  </g>

  <!-- Satellite Orbit -->
  <g>
    <ellipse cx="1050" cy="350" rx="100" ry="30" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.2" />
    <circle cx="1050" cy="350" r="3" fill="#00FF88">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1050,320 A100,30 0 1,1 1050,380 A100,30 0 1,1 1050,320" />
    </circle>
  </g>

  <!-- Central Hero Text -->
  <text x="600" y="280" font-family="Orbitron, sans-serif" font-size="72" fill="#FFFFFF" text-anchor="middle" stroke="#00B4D8" stroke-width="1" letter-spacing="4">
    EMMY PENCIL
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite" />
  </text>
  <text x="600" y="330" font-family="Nevada, sans-serif" font-size="24" fill="#90E0EF" text-anchor="middle" letter-spacing="6">
    BUILDING THE FUTURE
  </text>

  <!-- AI Pulse -->
  <circle cx="600" cy="250" r="200" fill="url(#pulseGrad)" opacity="0.1">
    <animate attributeName="r" values="150;250;150" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Scan Line -->
  <rect x="0" y="0" width="1200" height="3" fill="#00B4D8" opacity="0.3">
    <animate attributeName="y" values="0;500;0" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Hologram Glow -->
  <text x="600" y="400" font-family="Nevada, sans-serif" font-size="14" fill="#00B4D8" text-anchor="middle" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" />
    ▼ SYSTEM INITIALIZED ▼
  </text>
</svg>
