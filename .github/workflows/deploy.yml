name: Deploy Git Profile Koi

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
